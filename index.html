<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e88504">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Maolio — Chinese Vocabulary</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --theme: #e88504;
    --theme-dark: #b45309;
    --bg: #fdf3e0;
    --card: #fffaf0;
    --text: #2b1608;
    --muted: #8a6a4f;
    --border: #e6c9a3;
    --danger: #b91c1c;
    --hl-bg: #fef3c7;
    --hl-border: #d97706;
    --stripe: #2b1608;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    background-image: repeating-linear-gradient(45deg, transparent, transparent 34px, rgba(232,133,4,.05) 34px, rgba(232,133,4,.05) 40px);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: repeating-linear-gradient(90deg, var(--theme) 0 26px, var(--stripe) 26px 32px);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 3px solid var(--stripe);
  }
  header h1 {
    font-size: 1.25rem; flex: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }
  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    background: rgba(255,255,255,.2);
    border: none;
    color: #fff;
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
  }
  .tab-btn.active { background: #fff; color: var(--theme-dark); font-weight: 700; }
  .new-row-btn { background: #fffaf0; color: var(--theme-dark); font-weight: 700; }
  .sheet-select {
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fffaf0;
    color: var(--text);
    min-height: 44px;
    max-width: 40vw;
  }
  main { flex: 1; padding: 16px; max-width: 1000px; width: 100%; margin: 0 auto; }

  /* Table tab */
  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--theme);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 1rem;
    cursor: pointer;
    min-height: 44px;
  }
  .btn:active { background: var(--theme-dark); }
  .btn.secondary { background: #fff; color: var(--theme-dark); border: 1px solid var(--theme); }
  .btn.small { padding: 8px 12px; font-size: .95rem; min-height: 40px; }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: .4; cursor: default; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  th, td { border: 1px solid var(--border); padding: 6px; text-align: left; vertical-align: middle; }
  th { background: #fde4bd; color: var(--theme-dark); font-size: .95rem; padding: 10px; }
  td input, td textarea {
    width: 100%;
    border: none;
    font-size: 1.05rem;
    padding: 10px 8px;
    background: transparent;
    outline: none;
    min-height: 44px;
  }
  td textarea {
    font-family: inherit;
    line-height: 1.4;
    resize: none;
    overflow: hidden;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  td input:focus, td textarea:focus { background: #fde4bd; border-radius: 4px; }
  td .zh { font-size: 1.3rem; }
  .row-actions { display: flex; gap: 6px; justify-content: center; }
  .row-status { font-size: .85rem; color: var(--muted); margin-left: 12px; }
  .row-status.error { color: var(--danger); }
  .del-btn {
    background: none; border: none; color: var(--danger);
    font-size: 1.3rem; cursor: pointer; padding: 8px 12px; min-width: 44px; min-height: 44px;
  }
  .count-badge { color: var(--muted); font-size: .95rem; }

  /* Learn tab */
  .learn-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 24px; }
  .learn-card {
    background: var(--card);
    border-radius: 16px;
    border: 3px solid var(--stripe);
    box-shadow: 0 4px 16px rgba(43,22,8,.25);
    width: 100%;
    max-width: 640px;
    min-height: 320px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  .en-big { font-size: 2.6rem; font-weight: 700; }
  .say-card {
    font-size: 1.6rem;
    padding: 10px 26px;
    border-radius: 50px;
    background: var(--theme);
  }
  .hanzi-big { font-size: 4.5rem; line-height: 1.2; }
  .pinyin-big { font-size: 1.6rem; color: var(--theme-dark); }
  .note-box {
    background: var(--hl-bg);
    border: 2px solid var(--hl-border);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 1.1rem;
    max-width: 100%;
  }
  .learn-controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .learn-nav { display: flex; gap: 12px; align-items: center; }
  .card-counter { color: var(--muted); font-size: 1rem; }
  .empty-state { color: var(--muted); font-size: 1.2rem; text-align: center; padding: 40px 0; }
  #update-banner {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #2b1608;
    color: #fff;
    border: 2px solid var(--theme);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    z-index: 100;
    max-width: calc(100vw - 32px);
  }
  #update-banner button {
    background: var(--theme);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: .95rem;
    cursor: pointer;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="update-banner" hidden>
  <span>A new version is available.</span>
  <button onclick="applyUpdate()">Reload</button>
</div>
<header>
  <h1>🐯 Maolio</h1>
  <nav class="tabs">
    <button class="tab-btn active" id="tab-table" onclick="switchTab('table')">Table</button>
    <button class="tab-btn" id="tab-learn" onclick="switchTab('learn')">Learn</button>
  </nav>
  <button class="tab-btn new-row-btn" onclick="addRowFromAnywhere()" title="Add a new vocabulary row">+ Row</button>
</header>
<main>
  <section id="view-table">
    <div class="toolbar">
      <button class="btn" onclick="addRow()">+ Add row</button>
      <select id="sheet-select" class="sheet-select" onchange="switchSheet(this.value)" title="Switch sheet"></select>
      <button class="btn secondary" onclick="newSheet()" title="Create a new sheet">+ New sheet</button>
      <button class="btn secondary" onclick="renameSheet()" title="Rename the current sheet">✎ Rename</button>
      <span class="count-badge" id="table-count"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:22%">English</th>
          <th style="width:20%">Pinyin</th>
          <th style="width:15%">汉字</th>
          <th style="width:33%">Memory help</th>
          <th style="width:10%"></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </section>

  <section id="view-learn" hidden>
    <div class="learn-wrap" id="learn-wrap">
      <div class="learn-card" id="learn-card"></div>
      <div class="card-counter" id="learn-counter"></div>
      <div class="learn-controls" id="learn-controls"></div>
    </div>
    <div class="empty-state" id="learn-empty" hidden>Add some words in the Table tab first.</div>
  </section>
</main>

<script>
"use strict";

var STORAGE_KEY = "zht-vocab-table-v1";
var SHEETS_KEY = "zht-vocab-sheets-v1";
var SEED_ROWS = [
  { id: "r-seed-1", en: "hello", pinyin: "nǐ hǎo", hanzi: "你好",
    note: "你 = 'you' (person walking) + 好 = 'good' (woman + child)" },
  { id: "r-seed-2", en: "thank you", pinyin: "xiè xie", hanzi: "谢谢",
    note: "谢 = 'thank' — words of thanks on the tongue" },
  { id: "r-seed-3", en: "water", pinyin: "shuǐ", hanzi: "水",
    note: "Water flowing in a stream" }
];

var rows = [];
var sheets = [];          /* [{ id, name, rows: [...] }, ...] */
var currentSheetId = null;
var learnIndex = 0;
var learnRevealed = false;

function loadSheets() {
  var migrated = false;
  try {
    var raw = localStorage.getItem(SHEETS_KEY);
    var parsed = raw ? JSON.parse(raw) : null;
    if (parsed && Array.isArray(parsed.sheets) && parsed.sheets.length &&
        parsed.sheets.every(function (s) { return s && typeof s === "object" && Array.isArray(s.rows); })) {
      sheets = parsed.sheets;
      currentSheetId = parsed.currentSheetId || sheets[0].id;
      if (!sheets.some(function (s) { return s.id === currentSheetId; })) currentSheetId = sheets[0].id;
      rows = sheetById(currentSheetId).rows;
      return;
    }
  } catch (e) { /* corrupted — fall through to migration/seed */ }

  /* migration: single-list format (or nothing) -> one sheet */
  var legacy = null;
  try {
    var oldRaw = localStorage.getItem(STORAGE_KEY);
    var oldParsed = oldRaw ? JSON.parse(oldRaw) : null;
    if (Array.isArray(oldParsed) && oldParsed.length) {
      legacy = oldParsed.filter(function (r) { return r && typeof r === "object"; });
    }
  } catch (e) { legacy = null; }

  if (legacy) {
    sheets = [{ id: "s-main", name: "Sheet 1", rows: legacy }];
    migrated = true;
  } else {
    sheets = [{ id: "s-main", name: "Sheet 1", rows: SEED_ROWS.map(function (r) { return Object.assign({}, r); }) }];
    migrated = true;
  }
  currentSheetId = "s-main";
  rows = sheets[0].rows;
  if (migrated) saveSheets();
}

function sheetById(id) {
  for (var i = 0; i < sheets.length; i++) {
    if (sheets[i].id === id) return sheets[i];
  }
  return sheets[0];
}

function saveSheets() {
  try {
    localStorage.setItem(SHEETS_KEY, JSON.stringify({ sheets: sheets, currentSheetId: currentSheetId }));
  } catch (e) {
    try {
      localStorage.removeItem(SHEETS_KEY);
      localStorage.setItem(SHEETS_KEY, JSON.stringify({ sheets: sheets, currentSheetId: currentSheetId }));
    } catch (e2) { /* storage unavailable — app keeps working in memory */ }
  }
}

/* rows is always a live reference into the current sheet */
function saveRows() {
  saveSheets();
}

function switchSheet(id) {
  var s = sheetById(id);
  if (!s) return;
  currentSheetId = s.id;
  rows = s.rows;
  learnIndex = 0;
  learnRevealed = false;
  saveSheets();
  renderSheetSelect();
  renderTable();
  renderLearn();
}

function newSheet() {
  var name = prompt("Name for the new sheet:", "Sheet " + (sheets.length + 1));
  if (name === null) return;
  name = (name || "").trim() || ("Sheet " + (sheets.length + 1));
  var sheet = { id: "s-" + Date.now(), name: name, rows: [] };
  sheets.push(sheet);
  switchSheet(sheet.id);
}

function renameSheet() {
  var s = sheetById(currentSheetId);
  var name = prompt("Rename sheet:", s.name);
  if (name === null) return;
  name = (name || "").trim() || s.name;
  s.name = name;
  saveSheets();
  renderSheetSelect();
}

function renderSheetSelect() {
  var sel = document.getElementById("sheet-select");
  if (!sel) return;
  sel.innerHTML = "";
  sheets.forEach(function (s) {
    var opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.name;
    if (s.id === currentSheetId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function addRowFromAnywhere() {
  switchTab("table");
  addRow();
}

/* ---------- Table rendering ---------- */

function renderTable() {
  var body = document.getElementById("table-body");
  body.innerHTML = "";
  rows.forEach(function (row, i) {
    var tr = document.createElement("tr");

    var tdEn = document.createElement("td");
    var inputEn = cellInput(row, "en", "english");
    inputEn.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); translateRow(i); }
    });
    tdEn.appendChild(inputEn);

    var tdPin = document.createElement("td");
    var inputPin = cellInput(row, "pinyin", "pinyin");
    tdPin.appendChild(inputPin);

    var tdHz = document.createElement("td");
    tdHz.className = "zh";
    var inputHz = cellInput(row, "hanzi", "pinyin hanzi");
    tdHz.appendChild(inputHz);

    var tdNote = document.createElement("td");
    tdNote.appendChild(noteTextarea(row));

    var tdAct = document.createElement("td");
    var wrap = document.createElement("div");
    wrap.className = "row-actions";

    var trBtn = document.createElement("button");
    trBtn.className = "btn small secondary";
    trBtn.textContent = "译";
    trBtn.title = "Auto-translate";
    trBtn.addEventListener("click", function () { translateRow(i); });

    var sayBtn = document.createElement("button");
    sayBtn.className = "btn small secondary";
    sayBtn.textContent = "▶";
    sayBtn.title = "Pronounce";
    sayBtn.disabled = !row.hanzi;
    sayBtn.addEventListener("click", function () { speakHanzi(row.hanzi, row.id); });

    var delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.textContent = "✕";
    delBtn.title = "Delete row";
    delBtn.addEventListener("click", function () {
      rows.splice(i, 1);
      saveRows();
      renderTable();
    });

    wrap.appendChild(trBtn);
    wrap.appendChild(sayBtn);
    wrap.appendChild(delBtn);
    tdAct.appendChild(wrap);

    var status = document.createElement("span");
    status.className = "row-status";
    status.id = "status-" + row.id;
    tdAct.appendChild(status);

    tr.appendChild(tdEn);
    tr.appendChild(tdPin);
    tr.appendChild(tdHz);
    tr.appendChild(tdNote);
    tr.appendChild(tdAct);
    body.appendChild(tr);
  });
  document.getElementById("table-count").textContent =
    rows.length + (rows.length === 1 ? " word" : " words");
}

function cellInput(row, field, cls) {
  var input = document.createElement("input");
  input.type = "text";
  input.value = row[field] || "";
  if (cls) input.className = cls;
  input.addEventListener("input", function () {
    row[field] = input.value;
    saveRows();
    if (field === "hanzi") {
      var btn = input.closest("tr").querySelector(".row-actions .btn:nth-child(2)");
      if (btn) btn.disabled = !input.value;
    }
  });
  input.dataset.field = field;
  return input;
}

function noteTextarea(row) {
  var ta = document.createElement("textarea");
  ta.rows = 1;
  ta.value = row.note || "";
  ta.className = "note";
  ta.addEventListener("input", function () {
    row.note = ta.value;
    saveRows();
    autoGrow(ta);
  });
  ta.dataset.field = "note";
  autoGrow(ta);
  return ta;
}

function autoGrow(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + "px";
}

function addRow() {
  rows.push({ id: "r-" + Date.now(), en: "", pinyin: "", hanzi: "", note: "" });
  saveRows();
  renderTable();
  var body = document.getElementById("table-body");
  var last = body.lastElementChild;
  if (last) {
    var input = last.querySelector("td input");
    if (input) input.focus();
  }
}

function setRowStatus(id, text, isError) {
  var el = document.getElementById("status-" + id);
  if (!el) return;
  el.textContent = text || "";
  el.className = "row-status" + (isError ? " error" : "");
}

/* ---------- Auto-translate ---------- */

function translateRow(i) {
  var row = rows[i];
  if (!row) return;
  var q = (row.en || "").trim();
  if (!q) return;
  setRowStatus(row.id, "…");

  googleTranslate(q)
    .then(function (r) {
      if (r.pinyin) return r;
      return googlePinyin(r.hanzi)
        .then(function (py) { return { hanzi: r.hanzi, pinyin: py }; })
        .catch(function () { return r; });
    })
    .then(function (r) {
      applyTranslation(i, r.hanzi, r.pinyin);
      return buildNote(r.hanzi);
    })
    .then(function (note) {
      if (note) applyTranslation(i, null, null, note);
    })
    .catch(function () {
      return myMemoryTranslate(q)
        .then(function (r) { applyTranslation(i, r.hanzi, null); })
        .catch(function () {
          setRowStatus(row.id, "Translation failed — check your connection, or fill in manually", true);
        });
    });
}

function applyTranslation(i, hanzi, pinyin, note) {
  var row = rows[i];
  if (!row) return;
  if (hanzi && !row.hanzi) row.hanzi = hanzi;
  if (pinyin && !row.pinyin) row.pinyin = pinyin;
  if (note && !row.note) row.note = note;
  saveRows();
  renderTable();
  setRowStatus(row.id, "");
}

function hasHan(text) {
  return /[\u4e00-\u9fff]/.test(text);
}

function googleTranslate(q) {
  var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=" +
    encodeURIComponent(q);
  return fetch(url)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      var hanzi = "";
      for (var i = 0; i < data[0].length; i++) {
        if (data[0][i] && data[0][i][0]) hanzi += data[0][i][0];
      }
      if (!hasHan(hanzi)) throw new Error("no chinese result");
      return { hanzi: hanzi, pinyin: null };
    });
}

function googlePinyin(hanzi) {
  var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&dt=rm&q=" +
    encodeURIComponent(hanzi);
  return fetch(url)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      var pinyin = "";
      for (var j = 0; j < data[0].length; j++) {
        if (data[0][j] && data[0][j][3]) pinyin += data[0][j][3] + " ";
      }
      return pinyin.trim() || null;
    });
}

function charMeaning(ch) {
  var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=" +
    encodeURIComponent(ch);
  return fetch(url)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      var en = "";
      for (var j = 0; j < data[0].length; j++) {
        if (data[0][j] && data[0][j][0]) en += data[0][j][0];
      }
      en = en.trim();
      return en || null;
    });
}

function buildNote(hanzi) {
  var chars = [];
  var seen = {};
  for (var i = 0; i < hanzi.length; i++) {
    var ch = hanzi[i];
    if (/[\u4e00-\u9fff]/.test(ch) && !seen[ch]) {
      seen[ch] = true;
      chars.push(ch);
    }
  }
  if (!chars.length) return Promise.resolve(null);
  return Promise.all(chars.map(charMeaning))
    .then(function (meanings) {
      var parts = [];
      for (var j = 0; j < chars.length; j++) {
        if (meanings[j]) parts.push(chars[j] + " = " + meanings[j]);
      }
      return parts.join(" · ") || null;
    })
    .catch(function () { return null; });
}

function myMemoryTranslate(q) {
  var url = "https://api.mymemory.translated.net/get?q=" +
    encodeURIComponent(q) + "&langpair=en|zh-CN";
  return fetch(url)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      var hanzi = data && data.responseData && data.responseData.translatedText;
      if (!hanzi || !hasHan(hanzi)) throw new Error("no chinese result");
      return { hanzi: hanzi };
    });
}

/* ---------- Pronunciation ---------- */

var zhVoice = null;
function pickVoice() {
  try {
    var voices = speechSynthesis.getVoices();
    var prefs = ["zh-cn", "zh", "zh-hans", "zh-tw", "zh-sg"];
    for (var p = 0; p < prefs.length; p++) {
      for (var i = 0; i < voices.length; i++) {
        var lang = (voices[i].lang || "").toLowerCase();
        if (lang === prefs[p]) {
          zhVoice = voices[i];
          return;
        }
      }
    }
    for (var j = 0; j < voices.length; j++) {
      var l = (voices[j].lang || "").toLowerCase();
      if (l.indexOf("zh") === 0 && l !== "zh-yue" && l !== "zh-hk" && l !== "zh-hant-hk") {
        zhVoice = voices[j];
        return;
      }
    }
  } catch (e) { /* ignore */ }
}

var ttsReady = false;

function warmUpTts() {
  try {
    if (ttsReady || !("speechSynthesis" in window)) return;
    var u = new SpeechSynthesisUtterance("");
    u.volume = 0;
    speechSynthesis.speak(u);
    ttsReady = true;
  } catch (e) { /* ignore */ }
}

function speakHanzi(text, statusTarget) {
  try {
    if (!text || !("speechSynthesis" in window)) return;
    warmUpTts();
    if (!zhVoice) pickVoice();
    if (!zhVoice && statusTarget) {
      setRowStatus(statusTarget, "No Chinese voice found — install it: Settings → Text-to-speech", true);
    }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    if (zhVoice) u.voice = zhVoice;
    u.rate = 0.85;
    speechSynthesis.cancel();
    setTimeout(function () {
      try { speechSynthesis.speak(u); } catch (e) { /* ignore */ }
    }, 60);
  } catch (e) { /* silently ignore TTS failures */ }
}
if ("speechSynthesis" in window) {
  document.addEventListener("click", warmUpTts, { once: true });
  speechSynthesis.addEventListener("voiceschanged", pickVoice);
  pickVoice();
}

/* ---------- Learn mode ---------- */

function learnRows() {
  return rows.filter(function (r) { return (r.en || "").trim() !== ""; });
}

function renderLearn() {
  var list = learnRows();
  var wrap = document.getElementById("learn-wrap");
  var empty = document.getElementById("learn-empty");
  var card = document.getElementById("learn-card");
  var counter = document.getElementById("learn-counter");
  var controls = document.getElementById("learn-controls");

  if (!list.length) {
    wrap.hidden = true;
    empty.hidden = false;
    return;
  }
  wrap.hidden = false;
  empty.hidden = true;

  if (learnIndex >= list.length) learnIndex = 0;
  var row = list[learnIndex];

  card.innerHTML = "";
  var en = document.createElement("div");
  en.className = "en-big";
  en.textContent = row.en;
  card.appendChild(en);

  if (row.hanzi) {
    var sayCard = document.createElement("button");
    sayCard.className = "btn say-card";
    sayCard.textContent = "🔊";
    sayCard.title = "Read the Chinese word aloud";
    sayCard.addEventListener("click", function () { speakHanzi(row.hanzi); });
    card.appendChild(sayCard);
  }

  if (learnRevealed) {
    if (row.hanzi) {
      var hz = document.createElement("div");
      hz.className = "hanzi-big";
      hz.textContent = row.hanzi;
      card.appendChild(hz);
    }
    if (row.pinyin) {
      var py = document.createElement("div");
      py.className = "pinyin-big";
      py.textContent = row.pinyin;
      card.appendChild(py);
    }
    if (row.note) {
      var note = document.createElement("div");
      note.className = "note-box";
      note.textContent = row.note;
      card.appendChild(note);
    }
  }

  counter.textContent = "Card " + (learnIndex + 1) + " of " + list.length;

  controls.innerHTML = "";
  var prev = document.createElement("button");
  prev.className = "btn secondary";
  prev.textContent = "← Prev";
  prev.addEventListener("click", function () { navLearn(-1); });

  var show = document.createElement("button");
  show.className = "btn";
  show.textContent = "Show answer";
  show.hidden = learnRevealed;
  show.addEventListener("click", function () {
    learnRevealed = true;
    renderLearn();
  });

  var next = document.createElement("button");
  next.className = "btn secondary";
  next.textContent = "Next →";
  next.addEventListener("click", function () { navLearn(1); });

  if (learnRevealed) {
    var say = document.createElement("button");
    say.className = "btn";
    say.textContent = "▶ Pronounce";
    say.disabled = !row.hanzi;
    say.addEventListener("click", function () { speakHanzi(row.hanzi); });
    controls.appendChild(say);
  } else {
    controls.appendChild(show);
  }
  controls.appendChild(prev);
  controls.appendChild(next);
}

function navLearn(delta) {
  learnIndex += delta;
  var len = learnRows().length;
  if (learnIndex < 0) learnIndex = len - 1;
  if (learnIndex >= len) learnIndex = 0;
  learnRevealed = false;
  renderLearn();
}

function switchTab(tab) {
  var isTable = tab === "table";
  document.getElementById("view-table").hidden = !isTable;
  document.getElementById("view-learn").hidden = isTable;
  document.getElementById("tab-table").classList.toggle("active", isTable);
  document.getElementById("tab-learn").classList.toggle("active", !isTable);
  if (!isTable) {
    learnRevealed = false;
    renderLearn();
  }
}

/* ---------- Service worker / updates ---------- */

var waitingWorker = null;

function onWaitingWorker(reg) {
  if (!reg.waiting) return;
  waitingWorker = reg.waiting;
  var banner = document.getElementById("update-banner");
  if (banner) banner.hidden = false;
}

function applyUpdate() {
  try {
    if (waitingWorker) {
      waitingWorker.postMessage("skip-waiting");
      return;
    }
  } catch (e) { /* fall through to reload */ }
  window.location.reload();
}

function watchForUpdates() {
  if (!("serviceWorker" in navigator)) return;
  try {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      onWaitingWorker(reg);
      reg.addEventListener("updatefound", function () {
        var installing = reg.installing;
        if (!installing) return;
        installing.addEventListener("statechange", function () {
          if (installing.state === "installed" && navigator.serviceWorker.controller) {
            onWaitingWorker(reg);
          }
        });
      });
    }).catch(function (e) { /* registration failure — app still works */ });
  } catch (e) { /* ignore */ }
}

/* ---------- Init ---------- */

loadSheets();
renderSheetSelect();
renderTable();
watchForUpdates();
</script>
